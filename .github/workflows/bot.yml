name: kalshi paper bot

on:
  schedule:
    - cron: "0 */6 * * *"   # new run every 6 hours
  workflow_dispatch:         # "Run workflow" button to start it by hand

concurrency:
  group: bot                 # never two bots at once; next run waits for the last
  cancel-in-progress: false

permissions:
  contents: write            # lets the bot save state.json, trades.csv, README.md back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python bot.py test
      - name: Start Nemotron 3 Nano (free, runs on this server, no API key)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)   # harmless if the installer already started it
          sleep 5
          ollama pull nemotron-3-nano:4b
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
      - run: python -u bot.py
        env:
          RUN_SECONDS: "20700"   # 5h45m, leaves time for setup + saving before GitHub's 6h limit
          PUSH: "1"              # bot pushes the scoreboard (README.md) after every settled trade
      - name: Save trades
        if: always()
        run: |
          git add -A
          git commit -m "bot: save trades" || exit 0
          git pull --rebase
          git push
